spring:
  application:
  name: rabbitmq-extensions-demo

  #配置rabbitmq的基本信息
  rabbitmq:
    addresses: amqp://edison:edison@8.156.77.78:5672/extension
    listener:
      simple:
        #acknowledge-mode: none # 消息接收确认(自动确认)
        #acknowledge-mode: auto # 消息接收确认
        acknowledge-mode: manual # 消息接收确认(手动确认)
        retry:
          enabled: true # 开启消费者失败重试
          initial-interval: 5000ms # 初始失败等待时长为5秒
          max-retries: 5 # 最⼤重试次数(包括自身消费的一次)
    #publisher-confirm-type: correlated  # 消息发送确认(confirm模式 --- 站点收到了快递)
    #publisher-confirm-type: correlated  # 消息发送确认(confirm模式 --- 站点收到了无法送到的快递, 那么需要把快递退回)
